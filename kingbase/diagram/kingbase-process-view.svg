<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>GORM V1 适配 KingbaseES：过程视图</title><desc>从模式选择、连接初始化，到运行时访问与结构迁移的执行过程。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker><style>.title{font:700 32px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172033}.subtitle{font:16px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#52627A}.group{font:700 16px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif}.nodeTitle{font:700 17px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172033}.nodeText{font:13px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#42536D}.edge{stroke:#64748B;stroke-width:2;fill:none;marker-end:url(#arrow)}.edgeLabel{font:12px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#52627A}.footer{font:13px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#52627A}</style></defs><rect width="1600" height="900" fill="#F8FAFC"/><rect width="1600" height="8" fill="#0F8B6D"/><text x="60" y="62" class="title">GORM V1 适配 KingbaseES：过程视图</text><text x="60" y="96" class="subtitle">从模式选择、连接初始化，到运行时访问与结构迁移的执行过程。</text><rect x="50" y="150" width="1500" height="150" rx="12" fill="#F4F7FA" fill-opacity="0.33" stroke="#64748B" stroke-width="1.5" stroke-dasharray="7 5"/><text x="66" y="177" class="group" fill="#475569">阶段一：模式选择与连接初始化</text><rect x="50" y="350" width="900" height="390" rx="12" fill="#E8F1FF" fill-opacity="0.33" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="7 5"/><text x="66" y="377" class="group" fill="#2563EB">阶段二：运行时 CRUD 与查询</text><rect x="990" y="350" width="560" height="390" rx="12" fill="#E6F7F2" fill-opacity="0.33" stroke="#159C78" stroke-width="1.5" stroke-dasharray="7 5"/><text x="1006" y="377" class="group" fill="#0F8B6D">阶段三：建表与自动迁移</text><path class="edge" d="M 320 230 L 400 230"/><rect x="340" y="211" width="40" height="18" rx="4" fill="#F8FAFC"/><text x="360" y="224" text-anchor="middle" class="edgeLabel">选择方言</text><path class="edge" d="M 610 230 L 700 230"/><rect x="621" y="211" width="68" height="18" rx="4" fill="#F8FAFC"/><text x="655" y="224" text-anchor="middle" class="edgeLabel">sql.Open</text><path class="edge" d="M 910 230 L 1010 230"/><rect x="940" y="211" width="40" height="18" rx="4" fill="#F8FAFC"/><text x="960" y="224" text-anchor="middle" class="edgeLabel">连接句柄</text><path class="edge" d="M 1280 230 L 1360 230"/><rect x="1296.5" y="211" width="47" height="18" rx="4" fill="#F8FAFC"/><text x="1320" y="224" text-anchor="middle" class="edgeLabel">启动后验证</text><path class="edge" d="M 335 504 L 390 504"/><rect x="328.5" y="485" width="68" height="18" rx="4" fill="#F8FAFC"/><text x="362.5" y="498" text-anchor="middle" class="edgeLabel">创建 Scope</text><path class="edge" d="M 610 504 L 665 504"/><rect x="610.5" y="485" width="54" height="18" rx="4" fill="#F8FAFC"/><text x="637.5" y="498" text-anchor="middle" class="edgeLabel">SQL 请求</text><path class="edge" d="M 665 504 L 630 662.5"/><rect x="617" y="564.25" width="61" height="18" rx="4" fill="#F8FAFC"/><text x="647.5" y="577.25" text-anchor="middle" class="edgeLabel">SQL 与参数</text><path class="edge" d="M 630 662.5 L 690 662.5"/><rect x="647" y="643.5" width="26" height="18" rx="4" fill="#F8FAFC"/><text x="660" y="656.5" text-anchor="middle" class="edgeLabel">执行</text><path class="edge" d="M 1245 477.5 L 1290 477.5"/><rect x="1191.5" y="458.5" width="152" height="18" rx="4" fill="#F8FAFC"/><text x="1267.5" y="471.5" text-anchor="middle" class="edgeLabel">HasTable / HasColumn</text><path class="edge" d="M 1400 535 L 1270 615"/><rect x="1315" y="556" width="40" height="18" rx="4" fill="#F8FAFC"/><text x="1335" y="569" text-anchor="middle" class="edgeLabel">对象状态</text><path class="edge" d="M 1135 520 L 1270 615"/><rect x="1182.5" y="548.5" width="40" height="18" rx="4" fill="#F8FAFC"/><text x="1202.5" y="561.5" text-anchor="middle" class="edgeLabel">字段定义</text><g><rect x="90" y="195" width="230" height="70" rx="10" fill="#FFF5DB" stroke="#D99B2B" stroke-width="1.8"/><rect x="90" y="195" width="230" height="7" rx="5" fill="#E6A11A"/><text x="205" y="226" text-anchor="middle" class="nodeTitle">部署配置</text><text x="205" y="250" text-anchor="middle" class="nodeText">选择 MySQL 或 Oracle 模式</text></g><g><rect x="400" y="195" width="210" height="70" rx="10" fill="#E8F1FF" stroke="#3B82F6" stroke-width="1.8"/><rect x="400" y="195" width="210" height="7" rx="5" fill="#2563EB"/><text x="505" y="226" text-anchor="middle" class="nodeTitle">gorm.Open</text><text x="505" y="250" text-anchor="middle" class="nodeText">方言名、驱动名、DSN</text></g><g><rect x="700" y="195" width="210" height="70" rx="10" fill="#FFF0E8" stroke="#E27437" stroke-width="1.8"/><rect x="700" y="195" width="210" height="7" rx="5" fill="#D95F25"/><text x="805" y="226" text-anchor="middle" class="nodeTitle">sql.Open + Ping</text><text x="805" y="250" text-anchor="middle" class="nodeText">gokb 建立连接池</text></g><g><rect x="1010" y="195" width="270" height="70" rx="10" fill="#E6F7F2" stroke="#159C78" stroke-width="1.8"/><rect x="1010" y="195" width="270" height="7" rx="5" fill="#0F8B6D"/><text x="1145" y="226" text-anchor="middle" class="nodeTitle">KingbaseDialect.SetDB</text><text x="1145" y="250" text-anchor="middle" class="nodeText">创建独立方言实例并绑定连接</text></g><g><rect x="1360" y="185" width="150" height="90" rx="10" fill="#FCEBEC" stroke="#D65A63" stroke-width="1.8"/><rect x="1360" y="185" width="150" height="7" rx="5" fill="#C2414C"/><text x="1435" y="216" text-anchor="middle" class="nodeTitle">模式校验</text><text x="1435" y="240" text-anchor="middle" class="nodeText">SHOW database_mode</text><text x="1435" y="260" text-anchor="middle" class="nodeText">不一致则启动失败</text></g><g><rect x="95" y="455" width="240" height="98" rx="10" fill="#FFF5DB" stroke="#D99B2B" stroke-width="1.8"/><rect x="95" y="455" width="240" height="7" rx="5" fill="#E6A11A"/><text x="215" y="486" text-anchor="middle" class="nodeTitle">标准 GORM 调用</text><text x="215" y="510" text-anchor="middle" class="nodeText">Create / Find / Updates / Delete</text></g><g><rect x="390" y="445" width="220" height="118" rx="10" fill="#E8F1FF" stroke="#3B82F6" stroke-width="1.8"/><rect x="390" y="445" width="220" height="7" rx="5" fill="#2563EB"/><text x="500" y="476" text-anchor="middle" class="nodeTitle">Scope 与回调链</text><text x="500" y="500" text-anchor="middle" class="nodeText">模型解析、条件组合</text><text x="500" y="520" text-anchor="middle" class="nodeText">参数化 SQL 构造</text></g><g><rect x="665" y="445" width="220" height="118" rx="10" fill="#E6F7F2" stroke="#159C78" stroke-width="1.8"/><rect x="665" y="445" width="220" height="7" rx="5" fill="#0F8B6D"/><text x="775" y="476" text-anchor="middle" class="nodeTitle">方言 SQL 生成</text><text x="775" y="500" text-anchor="middle" class="nodeText">Quote、BindVar、分页</text><text x="775" y="520" text-anchor="middle" class="nodeText">DUAL、RETURNING</text></g><g><rect x="390" y="620" width="240" height="85" rx="10" fill="#FFF0E8" stroke="#E27437" stroke-width="1.8"/><rect x="390" y="620" width="240" height="7" rx="5" fill="#D95F25"/><text x="510" y="651" text-anchor="middle" class="nodeTitle">驱动执行与结果返回</text><text x="510" y="675" text-anchor="middle" class="nodeText">Exec / QueryRow</text><text x="510" y="695" text-anchor="middle" class="nodeText">扫描结果、错误返回</text></g><g><rect x="690" y="620" width="195" height="85" rx="10" fill="#F1EAFE" stroke="#8B5ED9" stroke-width="1.8"/><rect x="690" y="620" width="195" height="7" rx="5" fill="#7C3AED"/><text x="787.5" y="651" text-anchor="middle" class="nodeTitle">KingbaseES</text><text x="787.5" y="675" text-anchor="middle" class="nodeText">业务表及事务执行</text></g><g><rect x="1025" y="435" width="220" height="85" rx="10" fill="#FFF5DB" stroke="#D99B2B" stroke-width="1.8"/><rect x="1025" y="435" width="220" height="7" rx="5" fill="#E6A11A"/><text x="1135" y="466" text-anchor="middle" class="nodeTitle">AutoMigrate</text><text x="1135" y="490" text-anchor="middle" class="nodeText">确定表名与模型字段</text></g><g><rect x="1290" y="420" width="220" height="115" rx="10" fill="#E6F7F2" stroke="#159C78" stroke-width="1.8"/><rect x="1290" y="420" width="220" height="7" rx="5" fill="#0F8B6D"/><text x="1400" y="451" text-anchor="middle" class="nodeTitle">系统目录查询</text><text x="1400" y="475" text-anchor="middle" class="nodeText">表、列、索引、外键</text><text x="1400" y="495" text-anchor="middle" class="nodeText">USER_* / ALL_* / information_schema</text></g><g><rect x="1145" y="615" width="250" height="95" rx="10" fill="#E6F7F2" stroke="#159C78" stroke-width="1.8"/><rect x="1145" y="615" width="250" height="7" rx="5" fill="#0F8B6D"/><text x="1270" y="646" text-anchor="middle" class="nodeTitle">DDL 生成与执行</text><text x="1270" y="670" text-anchor="middle" class="nodeText">DataTypeOf、CREATE / ALTER</text><text x="1270" y="690" text-anchor="middle" class="nodeText">索引、字段修改</text></g><rect x="60" y="825" width="1480" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="800" y="852" text-anchor="middle" class="footer">运行时调用与迁移调用复用同一个方言实例；事务开始后由 BeginTx 将事务连接重新绑定给方言。</text></svg>
