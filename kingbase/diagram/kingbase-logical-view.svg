<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>GORM V1 适配 KingbaseES：逻辑视图</title><desc>以方言适配层隔离数据库差异，业务侧继续使用标准 GORM V1 API。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker><style>.title{font:700 32px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172033}.subtitle{font:16px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#52627A}.group{font:700 16px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif}.nodeTitle{font:700 17px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172033}.nodeText{font:13px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#42536D}.edge{stroke:#64748B;stroke-width:2;fill:none;marker-end:url(#arrow)}.edgeLabel{font:12px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#52627A}.footer{font:13px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#52627A}</style></defs><rect width="1600" height="900" fill="#F8FAFC"/><rect width="1600" height="8" fill="#0F8B6D"/><text x="60" y="62" class="title">GORM V1 适配 KingbaseES：逻辑视图</text><text x="60" y="96" class="subtitle">以方言适配层隔离数据库差异，业务侧继续使用标准 GORM V1 API。</text><rect x="330" y="150" width="390" height="575" rx="12" fill="#E8F1FF" fill-opacity="0.33" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="7 5"/><text x="346" y="177" class="group" fill="#2563EB">GORM V1 核心（复用）</text><rect x="770" y="150" width="440" height="575" rx="12" fill="#E6F7F2" fill-opacity="0.33" stroke="#159C78" stroke-width="1.5" stroke-dasharray="7 5"/><text x="786" y="177" class="group" fill="#0F8B6D">Kingbase 方言适配包（新增）</text><path class="edge" d="M 280 435 L 375 286"/><rect x="283" y="341.5" width="89" height="18" rx="4" fill="#F8FAFC"/><text x="327.5" y="354.5" text-anchor="middle" class="edgeLabel">标准 GORM API</text><path class="edge" d="M 525 342 L 525 390"/><rect x="491" y="347" width="68" height="18" rx="4" fill="#F8FAFC"/><text x="525" y="360" text-anchor="middle" class="edgeLabel">创建 Scope</text><path class="edge" d="M 525 510 L 525 555"/><rect x="498" y="513.5" width="54" height="18" rx="4" fill="#F8FAFC"/><text x="525" y="526.5" text-anchor="middle" class="edgeLabel">DDL 请求</text><path class="edge" d="M 675 286 L 825 276"/><rect x="733.5" y="262" width="33" height="18" rx="4" fill="#F8FAFC"/><text x="750" y="275" text-anchor="middle" class="edgeLabel">方言名</text><path class="edge" d="M 675 450 L 825 440"/><rect x="723" y="426" width="54" height="18" rx="4" fill="#F8FAFC"/><text x="750" y="439" text-anchor="middle" class="edgeLabel">生成 SQL</text><path class="edge" d="M 675 611 L 825 606"/><rect x="730" y="589.5" width="40" height="18" rx="4" fill="#F8FAFC"/><text x="750" y="602.5" text-anchor="middle" class="edgeLabel">对象检查</text><path class="edge" d="M 990 332 L 990 380"/><rect x="970" y="337" width="40" height="18" rx="4" fill="#F8FAFC"/><text x="990" y="350" text-anchor="middle" class="edgeLabel">确定模式</text><path class="edge" d="M 990 500 L 990 550"/><rect x="963" y="506" width="54" height="18" rx="4" fill="#F8FAFC"/><text x="990" y="519" text-anchor="middle" class="edgeLabel">复用方言实例</text><path class="edge" d="M 1155 440 L 1260 435"/><rect x="1177" y="418.5" width="61" height="18" rx="4" fill="#F8FAFC"/><text x="1207.5" y="431.5" text-anchor="middle" class="edgeLabel">SQL 与参数</text><path class="edge" d="M 1155 606 L 1300 660"/><rect x="1193.5" y="614" width="68" height="18" rx="4" fill="#F8FAFC"/><text x="1227.5" y="627" text-anchor="middle" class="edgeLabel">目录 / DDL</text><path class="edge" d="M 1375 500 L 1410 595"/><rect x="1369" y="528.5" width="47" height="18" rx="4" fill="#F8FAFC"/><text x="1392.5" y="541.5" text-anchor="middle" class="edgeLabel">连接与执行</text><g><rect x="70" y="370" width="210" height="130" rx="10" fill="#FFF5DB" stroke="#D99B2B" stroke-width="1.8"/><rect x="70" y="370" width="210" height="7" rx="5" fill="#E6A11A"/><text x="175" y="401" text-anchor="middle" class="nodeTitle">业务应用</text><text x="175" y="425" text-anchor="middle" class="nodeText">模型定义、CRUD、事务</text><text x="175" y="445" text-anchor="middle" class="nodeText">AutoMigrate、关联操作</text></g><g><rect x="375" y="230" width="300" height="112" rx="10" fill="#E8F1FF" stroke="#3B82F6" stroke-width="1.8"/><rect x="375" y="230" width="300" height="7" rx="5" fill="#2563EB"/><text x="525" y="261" text-anchor="middle" class="nodeTitle">GORM V1 API</text><text x="525" y="285" text-anchor="middle" class="nodeText">Open / Create / Find</text><text x="525" y="305" text-anchor="middle" class="nodeText">Updates / Transaction</text></g><g><rect x="375" y="390" width="300" height="120" rx="10" fill="#E8F1FF" stroke="#3B82F6" stroke-width="1.8"/><rect x="375" y="390" width="300" height="7" rx="5" fill="#2563EB"/><text x="525" y="421" text-anchor="middle" class="nodeTitle">模型与 SQL 构造</text><text x="525" y="445" text-anchor="middle" class="nodeText">模型解析、Scope、回调链</text><text x="525" y="465" text-anchor="middle" class="nodeText">参数绑定、表名和字段引用</text></g><g><rect x="375" y="555" width="300" height="112" rx="10" fill="#E8F1FF" stroke="#3B82F6" stroke-width="1.8"/><rect x="375" y="555" width="300" height="7" rx="5" fill="#2563EB"/><text x="525" y="586" text-anchor="middle" class="nodeTitle">建表与迁移主流程</text><text x="525" y="610" text-anchor="middle" class="nodeText">CreateTable、AutoMigrate</text><text x="525" y="630" text-anchor="middle" class="nodeText">索引、外键、关联表</text></g><g><rect x="825" y="220" width="330" height="112" rx="10" fill="#E6F7F2" stroke="#159C78" stroke-width="1.8"/><rect x="825" y="220" width="330" height="7" rx="5" fill="#0F8B6D"/><text x="990" y="251" text-anchor="middle" class="nodeTitle">方言注册与模式路由</text><text x="990" y="275" text-anchor="middle" class="nodeText">kingbase-mysql</text><text x="990" y="295" text-anchor="middle" class="nodeText">kingbase-oracle</text></g><g><rect x="825" y="380" width="330" height="120" rx="10" fill="#E6F7F2" stroke="#159C78" stroke-width="1.8"/><rect x="825" y="380" width="330" height="7" rx="5" fill="#0F8B6D"/><text x="990" y="411" text-anchor="middle" class="nodeTitle">SQL 兼容能力</text><text x="990" y="435" text-anchor="middle" class="nodeText">Quote、BindVar、DataTypeOf</text><text x="990" y="455" text-anchor="middle" class="nodeText">分页、DUAL、主键回填</text></g><g><rect x="825" y="550" width="330" height="112" rx="10" fill="#E6F7F2" stroke="#159C78" stroke-width="1.8"/><rect x="825" y="550" width="330" height="7" rx="5" fill="#0F8B6D"/><text x="990" y="581" text-anchor="middle" class="nodeTitle">DDL 与元数据适配</text><text x="990" y="605" text-anchor="middle" class="nodeText">HasTable / HasColumn / HasIndex</text><text x="990" y="625" text-anchor="middle" class="nodeText">ModifyColumn、系统目录查询</text></g><g><rect x="1260" y="370" width="230" height="130" rx="10" fill="#FFF0E8" stroke="#E27437" stroke-width="1.8"/><rect x="1260" y="370" width="230" height="7" rx="5" fill="#D95F25"/><text x="1375" y="401" text-anchor="middle" class="nodeTitle">Kingbase Go 驱动</text><text x="1375" y="425" text-anchor="middle" class="nodeText">database/sql + gokb</text><text x="1375" y="445" text-anchor="middle" class="nodeText">连接、参数传输、结果解码</text></g><g><rect x="1300" y="595" width="220" height="130" rx="10" fill="#F1EAFE" stroke="#8B5ED9" stroke-width="1.8"/><rect x="1300" y="595" width="220" height="7" rx="5" fill="#7C3AED"/><text x="1410" y="626" text-anchor="middle" class="nodeTitle">KingbaseES 实例</text><text x="1410" y="650" text-anchor="middle" class="nodeText">MySQL 兼容模式</text><text x="1410" y="670" text-anchor="middle" class="nodeText">Oracle 兼容模式</text></g><rect x="60" y="825" width="1480" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="800" y="852" text-anchor="middle" class="footer">适配边界：方言层负责 SQL 语义差异；gokb 负责连接协议；GORM V1 主干保持复用。</text></svg>
