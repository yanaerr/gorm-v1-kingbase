<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>GORM V1 适配 KingbaseES：场景视图</title><desc>围绕交付验收的四个关键场景，说明方言适配在何时参与以及预期结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker><style>.title{font:700 32px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172033}.subtitle{font:16px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#52627A}.group{font:700 16px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif}.nodeTitle{font:700 17px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172033}.nodeText{font:13px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#42536D}.edge{stroke:#64748B;stroke-width:2;fill:none;marker-end:url(#arrow)}.edgeLabel{font:12px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#52627A}.footer{font:13px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#52627A}</style></defs><rect width="1600" height="900" fill="#F8FAFC"/><rect width="1600" height="8" fill="#0F8B6D"/><text x="60" y="62" class="title">GORM V1 适配 KingbaseES：场景视图</text><text x="60" y="96" class="subtitle">围绕交付验收的四个关键场景，说明方言适配在何时参与以及预期结果。</text><rect x="60" y="160" width="710" height="260" rx="12" fill="#FFF5DB" fill-opacity="0.33" stroke="#D99B2B" stroke-width="1.5" stroke-dasharray="7 5"/><text x="76" y="187" class="group" fill="#E6A11A">场景一：应用启动与模式校验</text><rect x="830" y="160" width="710" height="260" rx="12" fill="#E6F7F2" fill-opacity="0.33" stroke="#159C78" stroke-width="1.5" stroke-dasharray="7 5"/><text x="846" y="187" class="group" fill="#0F8B6D">场景二：表结构创建与迁移</text><rect x="60" y="490" width="710" height="260" rx="12" fill="#E8F1FF" fill-opacity="0.33" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="7 5"/><text x="76" y="517" class="group" fill="#2563EB">场景三：CRUD 与分页查询</text><rect x="830" y="490" width="710" height="260" rx="12" fill="#F1EAFE" fill-opacity="0.33" stroke="#8B5ED9" stroke-width="1.5" stroke-dasharray="7 5"/><text x="846" y="517" class="group" fill="#7C3AED">场景四：事务执行</text><path class="edge" d="M 260 300 L 330 300"/><rect x="257.5" y="281" width="75" height="18" rx="4" fill="#F8FAFC"/><text x="295" y="294" text-anchor="middle" class="edgeLabel">方言名 + DSN</text><path class="edge" d="M 480 300 L 550 300"/><rect x="491.5" y="281" width="47" height="18" rx="4" fill="#F8FAFC"/><text x="515" y="294" text-anchor="middle" class="edgeLabel">连接成功后</text><path class="edge" d="M 1020 300 L 1080 300"/><rect x="1026.5" y="281" width="47" height="18" rx="4" fill="#F8FAFC"/><text x="1050" y="294" text-anchor="middle" class="edgeLabel">先检查对象</text><path class="edge" d="M 1260 300 L 1335 300"/><rect x="1260" y="281" width="75" height="18" rx="4" fill="#F8FAFC"/><text x="1297.5" y="294" text-anchor="middle" class="edgeLabel">缺失对象 / 字段</text><path class="edge" d="M 280 630 L 345 630"/><rect x="278.5" y="611" width="68" height="18" rx="4" fill="#F8FAFC"/><text x="312.5" y="624" text-anchor="middle" class="edgeLabel">创建 Scope</text><path class="edge" d="M 515 630 L 580 630"/><rect x="520.5" y="611" width="54" height="18" rx="4" fill="#F8FAFC"/><text x="547.5" y="624" text-anchor="middle" class="edgeLabel">SQL 构造</text><path class="edge" d="M 1020 630 L 1080 630"/><rect x="1030" y="611" width="40" height="18" rx="4" fill="#F8FAFC"/><text x="1050" y="624" text-anchor="middle" class="edgeLabel">事务句柄</text><path class="edge" d="M 1230 630 L 1300 630"/><rect x="1238" y="611" width="54" height="18" rx="4" fill="#F8FAFC"/><text x="1265" y="624" text-anchor="middle" class="edgeLabel">复用方言能力</text><g><rect x="100" y="255" width="160" height="90" rx="10" fill="#FFF5DB" stroke="#D99B2B" stroke-width="1.8"/><rect x="100" y="255" width="160" height="7" rx="5" fill="#E6A11A"/><text x="180" y="286" text-anchor="middle" class="nodeTitle">读取部署配置</text><text x="180" y="310" text-anchor="middle" class="nodeText">选择 kingbase-mysql</text><text x="180" y="330" text-anchor="middle" class="nodeText">或 kingbase-oracle</text></g><g><rect x="330" y="255" width="150" height="90" rx="10" fill="#E8F1FF" stroke="#3B82F6" stroke-width="1.8"/><rect x="330" y="255" width="150" height="7" rx="5" fill="#2563EB"/><text x="405" y="286" text-anchor="middle" class="nodeTitle">gorm.Open</text><text x="405" y="310" text-anchor="middle" class="nodeText">建立 gokb 连接</text></g><g><rect x="550" y="245" width="175" height="110" rx="10" fill="#FCEBEC" stroke="#D65A63" stroke-width="1.8"/><rect x="550" y="245" width="175" height="7" rx="5" fill="#C2414C"/><text x="637.5" y="276" text-anchor="middle" class="nodeTitle">SHOW database_mode</text><text x="637.5" y="300" text-anchor="middle" class="nodeText">一致：进入服务</text><text x="637.5" y="320" text-anchor="middle" class="nodeText">不一致：启动失败</text></g><g><rect x="870" y="255" width="150" height="90" rx="10" fill="#FFF5DB" stroke="#D99B2B" stroke-width="1.8"/><rect x="870" y="255" width="150" height="7" rx="5" fill="#E6A11A"/><text x="945" y="286" text-anchor="middle" class="nodeTitle">AutoMigrate</text><text x="945" y="310" text-anchor="middle" class="nodeText">模型、标签、表名</text></g><g><rect x="1080" y="245" width="180" height="110" rx="10" fill="#E6F7F2" stroke="#159C78" stroke-width="1.8"/><rect x="1080" y="245" width="180" height="7" rx="5" fill="#0F8B6D"/><text x="1170" y="276" text-anchor="middle" class="nodeTitle">元数据检查</text><text x="1170" y="300" text-anchor="middle" class="nodeText">HasTable / HasColumn</text><text x="1170" y="320" text-anchor="middle" class="nodeText">按模式查询系统目录</text></g><g><rect x="1335" y="245" width="160" height="110" rx="10" fill="#E6F7F2" stroke="#159C78" stroke-width="1.8"/><rect x="1335" y="245" width="160" height="7" rx="5" fill="#0F8B6D"/><text x="1415" y="276" text-anchor="middle" class="nodeTitle">DDL 执行</text><text x="1415" y="300" text-anchor="middle" class="nodeText">DataTypeOf、Quote</text><text x="1415" y="320" text-anchor="middle" class="nodeText">CREATE / ALTER / INDEX</text></g><g><rect x="100" y="585" width="180" height="90" rx="10" fill="#FFF5DB" stroke="#D99B2B" stroke-width="1.8"/><rect x="100" y="585" width="180" height="7" rx="5" fill="#E6A11A"/><text x="190" y="616" text-anchor="middle" class="nodeTitle">Create / Find / Updates</text><text x="190" y="640" text-anchor="middle" class="nodeText">标准 GORM API</text></g><g><rect x="345" y="585" width="170" height="90" rx="10" fill="#E8F1FF" stroke="#3B82F6" stroke-width="1.8"/><rect x="345" y="585" width="170" height="7" rx="5" fill="#2563EB"/><text x="430" y="616" text-anchor="middle" class="nodeTitle">Scope 与回调</text><text x="430" y="640" text-anchor="middle" class="nodeText">参数化 SQL、占位符</text></g><g><rect x="580" y="575" width="150" height="110" rx="10" fill="#E6F7F2" stroke="#159C78" stroke-width="1.8"/><rect x="580" y="575" width="150" height="7" rx="5" fill="#0F8B6D"/><text x="655" y="606" text-anchor="middle" class="nodeTitle">方言改写</text><text x="655" y="630" text-anchor="middle" class="nodeText">标识符、分页、DUAL</text><text x="655" y="650" text-anchor="middle" class="nodeText">主键回填策略</text></g><g><rect x="870" y="585" width="150" height="90" rx="10" fill="#E8F1FF" stroke="#3B82F6" stroke-width="1.8"/><rect x="870" y="585" width="150" height="7" rx="5" fill="#2563EB"/><text x="945" y="616" text-anchor="middle" class="nodeTitle">BeginTx</text><text x="945" y="640" text-anchor="middle" class="nodeText">创建 sql.Tx</text></g><g><rect x="1080" y="585" width="150" height="90" rx="10" fill="#E6F7F2" stroke="#159C78" stroke-width="1.8"/><rect x="1080" y="585" width="150" height="7" rx="5" fill="#0F8B6D"/><text x="1155" y="616" text-anchor="middle" class="nodeTitle">方言重绑定</text><text x="1155" y="640" text-anchor="middle" class="nodeText">SetDB(sql.Tx)</text></g><g><rect x="1300" y="575" width="190" height="110" rx="10" fill="#F1EAFE" stroke="#8B5ED9" stroke-width="1.8"/><rect x="1300" y="575" width="190" height="7" rx="5" fill="#7C3AED"/><text x="1395" y="606" text-anchor="middle" class="nodeTitle">执行事务内 SQL</text><text x="1395" y="630" text-anchor="middle" class="nodeText">成功提交</text><text x="1395" y="650" text-anchor="middle" class="nodeText">失败或异常回滚</text></g><rect x="60" y="825" width="1480" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="800" y="852" text-anchor="middle" class="footer">验收覆盖：模式校验、DDL 与目录访问、CRUD 与分页、事务重绑定和回滚。</text></svg>
