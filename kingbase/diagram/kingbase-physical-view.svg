<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>GORM V1 适配 KingbaseES：物理视图</title><desc>本适配为嵌入式 Go 组件，无独立服务或中间节点；应用进程通过驱动直连数据库实例。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker><style>.title{font:700 32px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172033}.subtitle{font:16px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#52627A}.group{font:700 16px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif}.nodeTitle{font:700 17px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172033}.nodeText{font:13px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#42536D}.edge{stroke:#64748B;stroke-width:2;fill:none;marker-end:url(#arrow)}.edgeLabel{font:12px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#52627A}.footer{font:13px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#52627A}</style></defs><rect width="1600" height="900" fill="#F8FAFC"/><rect width="1600" height="8" fill="#0F8B6D"/><text x="60" y="62" class="title">GORM V1 适配 KingbaseES：物理视图</text><text x="60" y="96" class="subtitle">本适配为嵌入式 Go 组件，无独立服务或中间节点；应用进程通过驱动直连数据库实例。</text><rect x="70" y="155" width="710" height="570" rx="12" fill="#FFF5DB" fill-opacity="0.33" stroke="#D99B2B" stroke-width="1.5" stroke-dasharray="7 5"/><text x="86" y="182" class="group" fill="#E6A11A">应用部署单元（业务服务器 / 容器）</text><rect x="980" y="155" width="550" height="570" rx="12" fill="#F1EAFE" fill-opacity="0.33" stroke="#8B5ED9" stroke-width="1.5" stroke-dasharray="7 5"/><text x="996" y="182" class="group" fill="#7C3AED">KingbaseES 数据库实例</text><path class="edge" d="M 385 320 L 455 312.5"/><rect x="386" y="297.25" width="68" height="18" rx="4" fill="#F8FAFC"/><text x="420" y="310.25" text-anchor="middle" class="edgeLabel">GORM API</text><path class="edge" d="M 590 380 L 360 510"/><rect x="427" y="426" width="96" height="18" rx="4" fill="#F8FAFC"/><text x="475" y="439" text-anchor="middle" class="edgeLabel">gorm.Dialect</text><path class="edge" d="M 490 572.5 L 535 572.5"/><rect x="482" y="553.5" width="61" height="18" rx="4" fill="#F8FAFC"/><text x="512.5" y="566.5" text-anchor="middle" class="edgeLabel">SQL 与参数</text><path class="edge" d="M 725 572.5 L 845 440"/><rect x="768.5" y="487.25" width="33" height="18" rx="4" fill="#F8FAFC"/><text x="785" y="500.25" text-anchor="middle" class="edgeLabel">TCP</text><path class="edge" d="M 955 440 L 1035 325"/><rect x="964.5" y="363.5" width="61" height="18" rx="4" fill="#F8FAFC"/><text x="995" y="376.5" text-anchor="middle" class="edgeLabel">目标模式二选一</text><path class="edge" d="M 955 440 L 1280 325"/><rect x="1087" y="363.5" width="61" height="18" rx="4" fill="#F8FAFC"/><text x="1117.5" y="376.5" text-anchor="middle" class="edgeLabel">目标模式二选一</text><path class="edge" d="M 1140 390 L 1275 525"/><rect x="1194.5" y="438.5" width="26" height="18" rx="4" fill="#F8FAFC"/><text x="1207.5" y="451.5" text-anchor="middle" class="edgeLabel">管理</text><path class="edge" d="M 1385 390 L 1275 525"/><rect x="1317" y="438.5" width="26" height="18" rx="4" fill="#F8FAFC"/><text x="1330" y="451.5" text-anchor="middle" class="edgeLabel">管理</text><g><rect x="125" y="260" width="260" height="120" rx="10" fill="#FFF5DB" stroke="#D99B2B" stroke-width="1.8"/><rect x="125" y="260" width="260" height="7" rx="5" fill="#E6A11A"/><text x="255" y="291" text-anchor="middle" class="nodeTitle">业务应用进程</text><text x="255" y="315" text-anchor="middle" class="nodeText">业务模型、标准 GORM V1 调用</text><text x="255" y="335" text-anchor="middle" class="nodeText">配置：目标模式、DSN、连接池参数</text></g><g><rect x="455" y="245" width="270" height="135" rx="10" fill="#E8F1FF" stroke="#3B82F6" stroke-width="1.8"/><rect x="455" y="245" width="270" height="7" rx="5" fill="#2563EB"/><text x="590" y="276" text-anchor="middle" class="nodeTitle">Go 运行时：GORM V1</text><text x="590" y="300" text-anchor="middle" class="nodeText">main.go、scope.go、callback_*.go</text><text x="590" y="320" text-anchor="middle" class="nodeText">模型解析、SQL 构造、事务管理</text></g><g><rect x="230" y="510" width="260" height="125" rx="10" fill="#E6F7F2" stroke="#159C78" stroke-width="1.8"/><rect x="230" y="510" width="260" height="7" rx="5" fill="#0F8B6D"/><text x="360" y="541" text-anchor="middle" class="nodeTitle">Kingbase 方言包</text><text x="360" y="565" text-anchor="middle" class="nodeText">kingbase-mysql / kingbase-oracle</text><text x="360" y="585" text-anchor="middle" class="nodeText">SQL、DDL、元数据差异适配</text></g><g><rect x="535" y="510" width="190" height="125" rx="10" fill="#FFF0E8" stroke="#E27437" stroke-width="1.8"/><rect x="535" y="510" width="190" height="7" rx="5" fill="#D95F25"/><text x="630" y="541" text-anchor="middle" class="nodeTitle">database/sql + gokb</text><text x="630" y="565" text-anchor="middle" class="nodeText">连接池、TLS/网络连接</text><text x="630" y="585" text-anchor="middle" class="nodeText">参数传输、结果解码</text></g><g><rect x="845" y="400" width="110" height="80" rx="10" fill="#F4F7FA" stroke="#64748B" stroke-width="1.8"/><rect x="845" y="400" width="110" height="7" rx="5" fill="#475569"/><text x="900" y="431" text-anchor="middle" class="nodeTitle">数据库访问端点</text><text x="900" y="455" text-anchor="middle" class="nodeText">DSN：host / port / dbname</text><text x="900" y="475" text-anchor="middle" class="nodeText">TCP 连接</text></g><g><rect x="1035" y="260" width="210" height="130" rx="10" fill="#F1EAFE" stroke="#8B5ED9" stroke-width="1.8"/><rect x="1035" y="260" width="210" height="7" rx="5" fill="#7C3AED"/><text x="1140" y="291" text-anchor="middle" class="nodeTitle">MySQL 兼容模式</text><text x="1140" y="315" text-anchor="middle" class="nodeText">业务 schema</text><text x="1140" y="335" text-anchor="middle" class="nodeText">information_schema、pg_indexes</text></g><g><rect x="1280" y="260" width="210" height="130" rx="10" fill="#F1EAFE" stroke="#8B5ED9" stroke-width="1.8"/><rect x="1280" y="260" width="210" height="7" rx="5" fill="#7C3AED"/><text x="1385" y="291" text-anchor="middle" class="nodeTitle">Oracle 兼容模式</text><text x="1385" y="315" text-anchor="middle" class="nodeText">业务 schema</text><text x="1385" y="335" text-anchor="middle" class="nodeText">USER_*、ALL_*、回退目录</text></g><g><rect x="1140" y="525" width="270" height="110" rx="10" fill="#F1EAFE" stroke="#8B5ED9" stroke-width="1.8"/><rect x="1140" y="525" width="270" height="7" rx="5" fill="#7C3AED"/><text x="1275" y="556" text-anchor="middle" class="nodeTitle">数据库对象</text><text x="1275" y="580" text-anchor="middle" class="nodeText">业务表、索引、外键</text><text x="1275" y="600" text-anchor="middle" class="nodeText">事务日志、系统目录</text></g><rect x="60" y="825" width="1480" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="800" y="852" text-anchor="middle" class="footer">同一应用实例一次连接只选择一种目标方言；部署启动时通过 SHOW database_mode 校验模式一致性。</text></svg>
